<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='personel.css') }}">
</head>
<body>

    <div class="kutu">
        <h1>Personel Yönetim Sistemi</h1>

        <h2>Giriş Yap</h2>

        <form action="/giris" method="POST">

            <p>
                <input
                    type="text"
                    name="kullanici_adi"
                    placeholder="Kullanıcı adını girin"
                    required
                >
            </p>

            <p>
                <input
                    type="password"
                    name="sifre"
                    placeholder="Şifreyi girin"
                    required
                >
            </p>

            <button type="submit">Giriş Yap</button>

        </form>

        {% if hata %}
            <p style="color: red;">
                {{ hata }}
            </p>
        {% endif %}

    </div>

</body>
</html>
